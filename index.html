<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StartPage</title>
    <style>
      body{
        text-align: center;
        background-image: linear-gradient(90deg,  rgb(215, 179, 106), rgb(125, 3, 125), rgb(85, 24, 122));
        font-family: sans-serif;
      }
      .startGame{
        width: 400px;
        height: 250px;
        margin-top: 100px;
        background-image: linear-gradient(90deg,  rgb(215, 179, 106), rgb(125, 3, 125), rgb(85, 24, 122));
        border-radius: 30px;
        font-size: 40px;
        font-family: sans-serif;
        cursor: pointer;
      }
      .startGame:hover{
        background-image: linear-gradient(90deg,  rgb(226, 167, 57), rgb(167, 12, 167), rgb(91, 22, 135));
      }

      .lastGame{
        font-size: 30px;
        font-weight: bold;
        color: rgb(204, 153, 25);
        animation: 3s lastgameanim ease-in;
      }

      @keyframes lastgameanim{
        0%{opacity: 0%;}
        100%{opacity: 100%;}
      }
      
      
      
    </style>
</head>
<body>
    <button id="startGame" onclick="startGame()" class="startGame">Start</button> <br><br><br>
    <div id="lastGame" class="lastGame"></div>
    

<script>
    function startGame(){
        window.location.href = "pokergame_js.html";
    }
window.addEventListener("load", () => {
  let winner = localStorage.getItem("winner");
  if (winner) {
    document.getElementById("lastGame").innerText = winner + " won the last game.";
    // localStorage.removeItem("winner");
  }
});
</script>


    
    

</body>
</html>
